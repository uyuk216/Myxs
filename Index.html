<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xメディア抽出</title>
<style>
  :root{
    --bg:#0b0e11;
    --panel:#12161b;
    --border:#20262d;
    --text:#e7ebee;
    --sub:#7c8894;
    --accent:#3ecf8e;
    --accent-dim:#1f5c42;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    padding:24px 16px 64px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    color:var(--accent);
    text-transform:uppercase;
  }
  h1{
    font-size:22px;
    margin:6px 0 4px;
    font-weight:700;
  }
  p.desc{color:var(--sub);font-size:13px;margin:0;}

  form{display:flex;gap:8px;margin:20px 0;}
  input[type=text]{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    padding:12px 14px;
    font-size:14px;
    font-family:var(--mono);
    outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);}
  button{
    background:var(--accent);
    color:#04140c;
    border:none;
    border-radius:8px;
    padding:0 18px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  button:disabled{background:var(--accent-dim);color:#7c8894;cursor:not-allowed;}

  .status{
    font-family:var(--mono);
    font-size:12px;
    color:var(--sub);
    min-height:18px;
    margin-bottom:8px;
  }
  .status.err{color:#e05a5a;}

  .meta{
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:16px;
    font-size:13px;
  }
  .meta .name{font-weight:700;}
  .meta .handle{color:var(--sub);font-family:var(--mono);font-size:12px;}
  .meta .text{margin-top:8px;line-height:1.6;white-space:pre-wrap;}

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
  }
  .media-card{
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--panel);
  }
  .media-card img, .media-card video{
    width:100%;
    display:block;
    background:#000;
  }
  .media-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 12px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--sub);
  }
  .media-foot a, .media-foot .dl-btn{
    color:var(--accent);
    text-decoration:none;
    font-weight:700;
    background:none;
    border:none;
    font-family:var(--mono);
    font-size:11px;
    cursor:pointer;
    padding:0;
  }
  .media-foot .dl-btn:disabled{color:var(--sub);cursor:not-allowed;}
  footer{
    margin-top:40px;
    color:var(--sub);
    font-size:11px;
    font-family:var(--mono);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">MEDIA EXTRACTOR</div>
    <h1>Xのリンクから画像・動画だけ抜き出す</h1>
    <p class="desc">ツイートのURLを貼ると、本文抜きでメディアだけ一覧表示します。</p>
  </header>

  <form id="form">
    <input id="url" type="text" placeholder="https://x.com/user/status/1234567890" autocomplete="off">
    <button id="submitBtn" type="submit">取得</button>
  </form>

  <div class="status" id="status"></div>
  <div id="metaBox"></div>
  <div class="grid" id="grid"></div>

  <footer>vxtwitter.com API 経由・非公式ツール</footer>
</div>

<script>
const form = document.getElementById('form');
const urlInput = document.getElementById('url');
const statusEl = document.getElementById('status');
const gridEl = document.getElementById('grid');
const metaBox = document.getElementById('metaBox');
const submitBtn = document.getElementById('submitBtn');

function extractId(raw){
  const m = raw.match(/status\/(\d+)/);
  return m ? m[1] : null;
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  gridEl.innerHTML = '';
  metaBox.innerHTML = '';
  statusEl.className = 'status';
  const id = extractId(urlInput.value.trim());
  if(!id){
    statusEl.textContent = 'URLからツイートIDを読み取れませんでした';
    statusEl.className = 'status err';
    return;
  }
  statusEl.textContent = '取得中...';
  submitBtn.disabled = true;

  try{
    const res = await fetch(`https://api.vxtwitter.com/Twitter/status/${id}`);
    if(!res.ok) throw new Error('API応答エラー: ' + res.status);
    const data = await res.json();

    if(data.mediaURLs && data.mediaURLs.length){
      metaBox.innerHTML = `
        <div class="meta">
          <span class="name">${escapeHtml(data.user_name||'')}</span>
          <span class="handle">@${escapeHtml(data.user_screen_name||'')}</span>
          <div class="text">${escapeHtml(data.text||'')}</div>
        </div>`;

      data.media_extended.forEach((m, i)=>{
        const card = document.createElement('div');
        card.className = 'media-card';
        const isVideo = m.type === 'video' || m.type === 'gif';
        card.innerHTML = isVideo
          ? `<video controls src="${m.url}"></video>`
          : `<img src="${m.url}" loading="lazy">`;
        const foot = document.createElement('div');
        foot.className = 'media-foot';
        const label = isVideo ? '動画' : '画像';
        const ext = isVideo ? 'mp4' : 'jpg';
        foot.innerHTML = `<span>${label} ${i+1}</span><button class="dl-btn" type="button">ダウンロード</button>`;
        const dlBtn = foot.querySelector('.dl-btn');
        dlBtn.addEventListener('click', ()=> downloadMedia(m.url, `x_media_${id}_${i+1}.${ext}`, dlBtn));
        card.appendChild(foot);
        gridEl.appendChild(card);
      });
      statusEl.textContent = `メディア ${data.media_extended.length} 件を取得`;
    } else {
      statusEl.textContent = 'このツイートにメディアが見つかりませんでした';
    }
  } catch(err){
    statusEl.textContent = '取得失敗: ' + err.message;
    statusEl.className = 'status err';
  } finally{
    submitBtn.disabled = false;
  }
});

async function downloadMedia(url, filename, btn){
  const original = btn.textContent;
  btn.textContent = '保存中...';
  btn.disabled = true;
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('ダウンロード失敗: ' + res.status);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(blobUrl), 5000);
    btn.textContent = '保存済み';
  } catch(err){
    btn.textContent = '失敗';
    alert('ダウンロードに失敗しました: ' + err.message);
  } finally{
    setTimeout(()=>{ btn.textContent = original; btn.disabled = false; }, 2000);
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
